<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Contact ClipNest with feedback, questions or website issues."><title>Contact Us — ClipNest</title><link rel="stylesheet" href="styles.css"></head><body><div id="header"></div><section class="page-hero"><div class="section-kicker">GET IN TOUCH</div><h1>We'd like to <span class="red-word">hear from you.</span></h1><p>Send feedback, report a broken page or ask a question about ClipNest.</p></section><main class="content-wrap"><h2>Contact the ClipNest team</h2><p>This demo contact form is not connected to email yet. Connect a form service or backend before publishing so messages can reach you.</p><form class="contact-form" id="contactForm"><label>Your name<input required name="name" placeholder="Name"></label><label>Email address<input required type="email" name="email" placeholder="you@example.com"></label><label>How can we help?<textarea required name="message" placeholder="Write your message..."></textarea></label><button class="btn btn-red" type="submit">Send message →</button><div id="contactMessage" class="tool-message" aria-live="polite"></div></form></main><div id="footer"></div><script src="layout.js"></script><script src="app.js"></script></body></html>
